<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypipe Academy – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { background: #fff; overflow-y: auto; }
    .auth-header-ornament {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="ico-arrow-left" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></symbol>
  <symbol id="ico-eye-on" viewBox="0 0 20 20"><path d="M10 4C5.5 4 1.73 6.61 0 10.5 1.73 14.39 5.5 17 10 17s8.27-2.61 10-6.5C18.27 6.61 14.5 4 10 4zm0 10.833a4.333 4.333 0 1 1 0-8.666 4.333 4.333 0 0 1 0 8.666zm0-6.933a2.6 2.6 0 1 0 0 5.2 2.6 2.6 0 0 0 0-5.2z" fill="currentColor"/></symbol>
</svg>

<!-- auth header -->
<div class="auth-header">
  <img src="image/ornament2.png" alt="" aria-hidden="true" class="auth-header-ornament" />
  <div class="auth-header-inner" style="display:flex;align-items:flex-end;justify-content:space-between;">
    <div>
      <button class="btn-back" onclick="location.href='welcome.html'" aria-label="Kembali">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><use href="#ico-arrow-left"/></svg>
      </button>
      <div class="auth-header-title">Login</div>
      <div class="auth-header-sub">Masuk ke akun anda</div>
    </div>
    <img src="image/logo polypipe 2.png" alt="Polypipe Academy" style="width:80px;object-fit:contain;" />
  </div>
</div>

<!-- form body -->
<div class="auth-body">
  <div style="display:flex;flex-direction:column;gap:16px;">
    <div class="input-group">
      <label class="input-label" for="email">Email</label>
      <div class="input-wrap">
        <div class="icon">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--gray-400)" stroke-width="1.5"><rect x="2" y="4" width="16" height="12" rx="2"/><path d="M2 7l8 5 8-5"/></svg>
        </div>
        <input id="email" type="email" placeholder="email@email.com" autocomplete="email" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" for="password">Password</label>
      <div class="input-wrap">
        <div class="icon">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--gray-400)" stroke-width="1.5"><rect x="4" y="9" width="12" height="8" rx="2"/><path d="M7 9V6.5a3 3 0 016 0V9"/></svg>
        </div>
        <input id="password" type="password" placeholder="Minimal 8 karakter" autocomplete="current-password" />
        <button type="button" onclick="togglePass()" style="background:none;border:none;cursor:pointer;padding:0;display:flex;align-items:center;color:var(--gray-400);" aria-label="Tampilkan password">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><use href="#ico-eye-on"/></svg>
        </button>
      </div>
    </div>
    <div style="text-align:right;">
      <a class="forgot-link" href="lupa.html">Lupa kata sandi?</a>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <button class="btn btn--primary btn--full" onclick="location.href='home.html'">Masuk</button>
    <div class="divider">atau</div>
    <button class="btn btn--outline btn--full" onclick="location.href='register.html'">Buat Akun Baru</button>
  </div>
</div>

<div class="home-indicator" style="color:var(--gray-800);"><span></span></div>

<script>
  function togglePass() {
    const inp = document.getElementById('password');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }
</script>
</body>
</html>
