<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypipe Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      position: relative;
      background: linear-gradient(160deg, #04152f 0%, #0a2a6e 55%, #0d4495 100%);
      min-height: 100vh;
      overflow: hidden;
      align-items: center;
      justify-content: center;
    }

    /* Brand logo */
    .brand-logo {
      width: 180px;
      margin-bottom: 24px;
    }

    .brand-sep {
      width: 40px;
      height: 2px;
      background: rgba(255,255,255,.25);
      border-radius: 2px;
      margin: 20px 0;
    }

    .tagline {
      font-size: 14px;
      line-height: 22px;
      color: rgba(255,255,255,.6);
      text-align: center;
      max-width: 220px;
    }

    /* Loading dots */
    .loading-dots {
      display: flex;
      gap: 6px;
      margin-top: 48px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,.5);
      animation: pulse 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    .copyright {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.3);
    }
  </style>
</head>
<body>

<!-- ornament header background -->
<img src="image/Ornament-header.png" alt="" aria-hidden="true" style="position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:0;" />

<!-- main content -->
<div style="display:flex;flex-direction:column;align-items:center;position:relative;z-index:1;">
  <img src="image/Logo Polypipe white.png" alt="Polypipe Academy" class="brand-logo" />
  <div class="brand-sep"></div>
  <p class="tagline">Panduan pengelasan pipa HDPE standar internasional</p>
  <div class="loading-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<p class="copyright">© 2026 polypipe.id academy. All rights reserved</p>

<!-- tap anywhere to continue -->
<a href="welcome.html" style="position:absolute;inset:0;z-index:2;" aria-label="Lanjut ke halaman selamat datang"></a>

</body>
</html>
