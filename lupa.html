<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypipe Academy – Lupa Kata Sandi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { background: #fff; }
  </style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="ico-arrow-left" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></symbol>
</svg>

<!-- simple header -->
<div class="simple-header">
  <button class="btn-back btn-back--light" onclick="location.href='login.html'" aria-label="Kembali ke login">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--gray-700)"><use href="#ico-arrow-left"/></svg>
  </button>
  <span class="simple-title">Lupa Kata Sandi</span>
</div>

<!-- body -->
<div class="simple-body">
  <!-- icon illustration -->
  <div style="display:flex;flex-direction:column;align-items:center;padding:24px 0 8px;gap:12px;">
    <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#e8efff,#d0deff);display:flex;align-items:center;justify-content:center;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--prime-500)" stroke-width="1.5" stroke-linecap="round">
        <rect x="2" y="7" width="14" height="10" rx="2"/>
        <path d="M7 7V5a5 5 0 0 1 10 0v4M17 12h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2"/>
      </svg>
    </div>
    <div style="text-align:center;">
      <p style="font-size:15px;font-weight:600;color:var(--gray-800);">Reset Password</p>
      <p class="simple-desc" style="margin-top:4px;max-width:240px;">Masukkan email Anda, kami akan mengirimkan tautan untuk reset password.</p>
    </div>
  </div>

  <div class="input-group">
    <label class="input-label" for="email">Alamat Email</label>
    <div class="input-wrap">
      <div class="icon">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="var(--gray-400)" stroke-width="1.5"><rect x="2" y="4" width="16" height="12" rx="2"/><path d="M2 7l8 5 8-5"/></svg>
      </div>
      <input id="email" type="email" placeholder="email@email.com" autocomplete="email" />
    </div>
  </div>

  <button class="btn btn--primary btn--full" onclick="location.href='password.html'">Kirim Tautan Reset</button>
</div>

<div class="home-indicator" style="color:var(--gray-800);margin-top:auto;"><span></span></div>

</body>
</html>
