<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypipe Academy – Password Baru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { background: #fff; }
  </style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="ico-arrow-left" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></symbol>
</svg>

<!-- simple header -->
<div class="simple-header">
  <button class="btn-back btn-back--light" onclick="location.href='lupa.html'" aria-label="Kembali">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--gray-700)"><use href="#ico-arrow-left"/></svg>
  </button>
  <span class="simple-title">Password Baru</span>
</div>

<!-- body -->
<div class="simple-body">
  <!-- icon illustration -->
  <div style="display:flex;flex-direction:column;align-items:center;padding:24px 0 8px;gap:12px;">
    <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#e8efff,#d0deff);display:flex;align-items:center;justify-content:center;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--prime-500)" stroke-width="1.5" stroke-linecap="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        <circle cx="12" cy="16" r="1" fill="var(--prime-500)"/>
      </svg>
    </div>
    <div style="text-align:center;">
      <p style="font-size:15px;font-weight:600;color:var(--gray-800);">Buat Password Baru</p>
      <p class="simple-desc" style="margin-top:4px;max-width:240px;">Pastikan password baru Anda minimal 8 karakter.</p>
    </div>
  </div>

  <div class="input-group">
    <label class="input-label" for="password">Password Baru <span class="req">*</span></label>
    <div class="input-wrap">
      <input id="password" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password" />
    </div>
  </div>
  <div class="input-group">
    <label class="input-label" for="konfirmasi">Konfirmasi Password <span class="req">*</span></label>
    <div class="input-wrap">
      <input id="konfirmasi" type="password" placeholder="Ulangi password" autocomplete="new-password" />
    </div>
  </div>

  <button class="btn btn--primary btn--full" onclick="location.href='login.html'">Simpan Password</button>
</div>

<div class="home-indicator" style="color:var(--gray-800);margin-top:auto;"><span></span></div>

</body>
</html>
