<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polypipe Academy – Daftar Akun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { background: #fff; overflow-y: auto; }
    .auth-header-ornament {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="ico-arrow-left" viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></symbol>
</svg>

<!-- auth header -->
<div class="auth-header">
  <img src="image/ornament2.png" alt="" aria-hidden="true" class="auth-header-ornament" />
  <div class="auth-header-inner" style="display:flex;align-items:flex-end;justify-content:space-between;">
    <div>
      <button class="btn-back" onclick="location.href='welcome.html'" aria-label="Kembali">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><use href="#ico-arrow-left"/></svg>
      </button>
      <div class="auth-header-title">Daftar Akun</div>
      <div class="auth-header-sub">Buat akun baru Anda</div>
    </div>
    <img src="image/logo polypipe 2.png" alt="Polypipe Academy" style="width:80px;object-fit:contain;" />
  </div>
</div>

<!-- form body -->
<div class="auth-body">
  <div style="display:flex;flex-direction:column;gap:14px;">
    <div class="input-group">
      <label class="input-label" for="nama">Nama Lengkap <span class="req">*</span></label>
      <div class="input-wrap">
        <input id="nama" type="text" placeholder="Nama Lengkap" autocomplete="name" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" for="email">Email <span class="req">*</span></label>
      <div class="input-wrap">
        <input id="email" type="email" placeholder="email@email.com" autocomplete="email" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" for="perusahaan">Perusahaan</label>
      <div class="input-wrap">
        <input id="perusahaan" type="text" placeholder="Nama Perusahaan" autocomplete="organization" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" for="hp">No. HP <span class="req">*</span></label>
      <div class="input-wrap">
        <input id="hp" type="tel" placeholder="08xxxxxxxxxx" autocomplete="tel" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" for="password">Password <span class="req">*</span></label>
      <div class="input-wrap">
        <input id="password" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password" />
      </div>
    </div>
    <div class="input-group">
      <label class="input-label" for="konfirmasi">Konfirmasi Password <span class="req">*</span></label>
      <div class="input-wrap">
        <input id="konfirmasi" type="password" placeholder="Ulangi password" autocomplete="new-password" />
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <button class="btn btn--primary btn--full" onclick="location.href='home.html'">Daftar</button>
    <p style="font-size:13px;text-align:center;color:var(--gray-500);">
      Sudah punya akun? <a style="color:var(--prime-500);font-weight:600;text-decoration:none;" href="login.html">Masuk di sini</a>
    </p>
  </div>
</div>

</body>
</html>
